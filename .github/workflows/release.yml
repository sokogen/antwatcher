# Runs on a version tag and publishes the service alone -- no collector, no
# Tempo, no Grafana: archives for linux and darwin on amd64 and arm64 with the
# checksums that cover them, and a linux/amd64 + linux/arm64 image in ghcr.io.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two workflows for one tag -- a tag deleted and re-pushed, or two tags pushed
# together -- would race on `gh release upload --clobber` and on the `latest`
# image, leaving whichever finished last rather than the higher version. They
# are queued instead of cancelled: a half-published release is worse than a
# slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    # Needed to create the release and attach the archives to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # go.mod is the single source of truth for the Go version.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # `make build` owns the ldflags, so a binary released here is stamped
      # exactly like a local one, with the tag as the version.
      - name: Build the archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p dist
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="$(echo "$COMMIT" | cut -c1-7)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="antwatcher_${VERSION}_${os}_${arch}"
            stage="dist/$name"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              make build VERSION="$VERSION" COMMIT="$commit" DATE="$date" \
                BINARY="$PWD/$stage/antwatcher"
            cp README.md LICENSE antwatcher.example.yml "$stage/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            rm -rf "$stage"
          done
          ( cd dist && sha256sum ./*.tar.gz > checksums.txt )
          ls -l dist

      # `gh release create` fails if the release already exists, which it does
      # when the tag was published through the UI, so upload into it instead.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              dist/*.tar.gz dist/checksums.txt
          fi

  image:
    runs-on: ubuntu-latest
    # `packages: write` pushes to ghcr.io on the built-in GITHUB_TOKEN, which is
    # why ghcr.io was chosen: no repository secret has to exist.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The Dockerfile cross-compiles from the build platform, so linux/arm64 is
      # built natively on the amd64 runner and no QEMU step is needed.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3, 1.2.3, 1.2, and latest -- the last only for a release that is
      # not a prerelease, which is what the default `latest=auto` flavour means.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The short commit is the one the binaries job stamps. The timestamp is
      # this job's own: the two jobs run in parallel on separate runners, so an
      # image and an archive from one tag report the same version and commit
      # but their own build times, minutes apart at most.
      - name: Stamp the build metadata
        id: stamp
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$(echo "$COMMIT" | cut -c1-7)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same three args the Makefile and the binaries job pass, so
          # `antwatcher version` inside the image reports the tag.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.stamp.outputs.commit }}
            DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
